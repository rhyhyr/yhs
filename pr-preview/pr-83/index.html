<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Navigator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; }
    header { background: #1a73e8; color: white; padding: 20px 40px; }
    header h1 { font-size: 1.5rem; }
    header p  { font-size: 0.9rem; opacity: 0.85; margin-top: 4px; }
    main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; border-radius: 8px; padding: 24px; margin-bottom: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .status-badge { display: inline-block; background: #e8f5e9; color: #2e7d32;
                    padding: 4px 12px; border-radius: 12px; font-size: 0.85rem; }
    .meta { color: #888; font-size: 0.8rem; margin-top: 8px; }
    .features { list-style: none; }
    .features li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .features li:last-child { border: none; }
    .features li::before { content: "✓ "; color: #1a73e8; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🌐 Global Campus Visa Navigator</h1>
    <p>외국인 유학생 비자·학사 안내 근거중심 도우미</p>
  </header>
  <main>
    <div class="card">
      <span class="status-badge">서비스 운영 중</span>
      <p class="meta">배포 시각: <span id="ts"></span></p>
    </div>
    <div class="card">
      <h2>핵심 기능</h2>
      <ul class="features" style="margin-top:12px">
        <li>하이브리드 비자·학사 질의응답</li>
        <li>정책 문서 인덱싱 파이프라인</li>
        <li>리스크 최소화 응답 정책</li>
      </ul>
    </div>
    <div class="card">
      <h2>기술 스택</h2>
      <p style="margin-top:8px;line-height:1.8">
        Python 3.11 · Gemini / OpenAI · Neo4j · SentenceTransformers · GitHub Actions
      </p>
    </div>
  </main>
  <script>
    document.getElementById('ts').textContent = new Date().toLocaleString('ko-KR');
  </script>
</body>
</html>
