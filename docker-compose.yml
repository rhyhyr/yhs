services:

  # ── 백엔드 (FastAPI + RAG 엔진) ────────────────────────────────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      PDF_DIR: /app/pdf
    volumes:
      - ./pdf:/app/pdf
      - ./logs:/app/logs
      - hf_cache:/root/.cache/huggingface   # HuggingFace 모델 캐시
      - torch_cache:/root/.cache/torch       # PyTorch 모델 캐시
    depends_on:
      neo4j:
        condition: service_healthy

  # ── 프론트엔드 (React + Vite → nginx) ──────────────────────────────
  frontend:
    build:
      context: ../feyhs
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Neo4j 데이터베이스 ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:       # Neo4j DB 데이터
  hf_cache:         # HuggingFace 모델 (BAAI/bge-m3 등)
  torch_cache:      # PyTorch 캐시
