services:

  # ── Ollama (EXAONE 로컬 LLM 서버) ──────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama   # 모델 파일 영구 저장 (재시작 시 재다운로드 없음)
    # GPU가 있는 경우 아래 주석 해제
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── 백엔드 (FastAPI + RAG 엔진) ────────────────────────────────────
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: neo4j://neo4j:7687
      PDF_DIR: /app/pdf
      OLLAMA_BASE_URL: http://ollama:11434   # 도커 내부 Ollama 주소
    volumes:
      - ./pdf:/app/pdf
      - ./logs:/app/logs
      - hf_cache:/root/.cache/huggingface   # 임베딩 모델(BAAI/bge-m3) 캐시
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # ── 프론트엔드 (React + Vite → nginx) ──────────────────────────────
  frontend:
    build:
      context: ../feyhs
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Neo4j 데이터베이스 ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:       # Neo4j DB 데이터
  ollama_data:      # Ollama 모델 파일 (exaone3.5:7b 등)
  hf_cache:         # HuggingFace 임베딩 모델 (BAAI/bge-m3)
