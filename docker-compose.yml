# ─────────────────────────────────────────────────────────────────────────────
# yhs — 로컬/개발용 스택
#
#   docker compose up -d --build              기본 (외부 LLM API 사용)
#   docker compose --profile ollama up -d     로컬 LLM(Ollama)까지 함께 실행
#   docker compose down -v                    볼륨까지 정리
#
# 접속:  프론트 http://localhost:3000   API http://localhost:8000/docs
#        Neo4j 브라우저 http://localhost:7474
#
# 운영 배포는 deploy/docker-compose.prod.yml 을 겹쳐서 씁니다.
# ─────────────────────────────────────────────────────────────────────────────
name: yhs

services:
  # ── Neo4j — 그래프 지식베이스 ───────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "7474:7474"   # 브라우저 UI
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 를 .env 에 설정하세요}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$NEO4J_PASSWORD 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Ollama — 로컬 LLM (선택) ────────────────────────────────────────────────
  # RUNTIME_LLM=ollama 로 쓸 때만 필요합니다.
  #   docker compose --profile ollama up -d
  # 첫 실행 후 모델을 한 번 받아야 합니다:
  #   docker compose exec ollama ollama pull exaone3.5:7.8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # GPU 가 있으면 아래 주석을 해제하세요.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── 백엔드 — FastAPI + Graph RAG ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"     # 운영에서는 nginx 뒤에 두고 이 포트를 닫습니다.
    env_file:
      - .env
    environment:
      # 컨테이너 네트워크 기준 주소로 덮어씁니다 (.env 의 localhost 값 무시).
      NEO4J_URI: neo4j://neo4j:7687
      OLLAMA_BASE_URL: http://ollama:11434
      # 설치본에서는 저장소 경로를 알 수 없으므로 명시합니다.
      DATA_DIR: /data
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - ./data:/data                        # 인제스트 코퍼스 + 캐시
      - hf_cache:/home/app/.cache/huggingface  # bge-m3 임베딩 모델 캐시
    depends_on:
      neo4j:
        condition: service_healthy

  # ── 프론트엔드 — React 빌드 + nginx (백엔드 리버스 프록시 포함) ─────────────
  frontend:
    build:
      context: ./frontend
      args:
        # 비워 두면 같은 오리진의 /api 로 호출하고 nginx 가 프록시합니다.
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  neo4j_data:
  neo4j_logs:
  ollama_data:
  hf_cache:
