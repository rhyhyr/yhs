# 프론트 정적 파일 + 백엔드 리버스 프록시.
#
# 프론트와 API 를 같은 오리진(:80)으로 묶는다. 그래서
#   - 프론트에 백엔드 주소를 하드코딩할 필요가 없고
#   - CORS 설정이 아예 필요 없어진다.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API 프록시 ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # deep path + 웹 크롤링은 수십 초가 걸릴 수 있다.
        proxy_connect_timeout 10s;
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_buffering       off;    # 스트리밍 응답을 대비해 버퍼링 해제
    }

    location = /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # ── 정적 자산 ────────────────────────────────────────────────────────────
    # Vite 가 파일명에 해시를 붙이므로 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA 라우팅 ───────────────────────────────────────────────────────────
    # 새로고침해도 index.html 이 응답하도록 (클라이언트 라우터가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
