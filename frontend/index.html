<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 기존에 있던 /favicon.svg 참조는 실제 파일이 없어 깨져 있었음 — 실제로 존재하는 PNG 아이콘으로 교체 -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2155CD" />
    <!-- iOS 홈 화면에 추가했을 때 브라우저 UI 없이 앱처럼 열리게 함 (PWA manifest 는 iOS Safari 가 안 읽음) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YuGuide" />
    <title>YuGuide AI</title>
    <!-- 구글 캘린더 연동(로그인 없이, 백엔드 없이)용 — Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
