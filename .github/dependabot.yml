version: 2
updates:
  # Python 백엔드
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff*"]   # 개발 도구는 묶어서 한 PR 로
    labels: ["dependencies", "python"]

  # React 프론트엔드
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "npm"]

  # 도커 베이스 이미지
  - package-ecosystem: docker
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]

  # GitHub Actions 버전
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "actions"]
