name: Security Audit & Report

on:
  push:
    branches:
      - hwa
  schedule:
    - cron: '0 9 * * 1' # 매주 월요일 오전 9시 정기 검사

jobs:
  npm-audit-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # 자동 이슈 생성을 위한 필수 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # ▼▼▼ 에러 해결을 위해 새로 추가된 부분 ▼▼▼
      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Run npm audit and Create Issue on Failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 2>&1 을 추가해 에러 메시지까지 파일에 담도록 개선했습니다.
          if ! npm audit --audit-level=moderate > audit-report.txt 2>&1; then
            echo "Vulnerabilities found or audit failed! Creating an issue..."
            gh issue create \
              --title "🚨 [보안 경고] npm 패키지 취약점 발견" \
              --body-file audit-report.txt \
              --label "security,bug" || echo "이슈 생성 실패 (저장소 설정 확인)"
          else
            echo "안전합니다! 취약점이 발견되지 않았습니다."
          fi