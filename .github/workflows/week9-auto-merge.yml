name: "Week9 ③ Dependabot PR 자동 머지"

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'   # Dependabot이 연 PR만 대상
    steps:
      - name: Dependabot 메타데이터 확인
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: 패치 업데이트면 자동 머지
        # 패치(1.0.x)는 자동, 마이너/메이저는 수동 검토
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
