name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 백엔드: 린트 + 단위 테스트 ──────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: 의존성 설치
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 린트 (ruff)
        run: ruff check .

      - name: 단위 테스트
        working-directory: backend
        # integration 마커는 Ollama 서버가 필요하므로 CI 에서는 건너뛴다.
        run: pytest -m "not integration" --cov=yhs --cov-report=term-missing --cov-report=xml

      - name: 커버리지 리포트 업로드
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  # ── 설정 YAML 유효성 ────────────────────────────────────────────────────────
  config:
    name: Config YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: YAML 파싱 + 라우팅 파일명 실재 검증
        run: |
          pip install PyYAML
          python - <<'PY'
          import pathlib, sys, yaml

          cfg = pathlib.Path("backend/config")
          for f in sorted(cfg.glob("*.yaml")):
              yaml.safe_load(f.read_text(encoding="utf-8"))
              print(f"  OK  {f}")

          # routing.yaml 이 가리키는 PDF 가 data/sources 에 실재하는지 확인한다.
          # (문서를 교체하면서 표를 안 고치는 실수를 CI 에서 잡는다)
          routing = yaml.safe_load((cfg / "routing.yaml").read_text(encoding="utf-8"))
          have = {p.name for p in pathlib.Path("data/sources").glob("*.pdf")}
          missing = sorted({f for files in routing["source_routing"].values() for f in files} - have)
          if missing:
              print("\nrouting.yaml 이 참조하는 파일이 data/sources 에 없습니다:")
              for m in missing:
                  print("  -", m)
              sys.exit(1)
          print("\n라우팅 대상 파일 모두 존재")
          PY

  # ── 프론트엔드: 린트 + 빌드 ─────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        run: npm run build

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ── 도커 이미지 빌드 확인 (푸시는 하지 않음) ────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: compose 파일 검증
        run: |
          echo "NEO4J_PASSWORD=ci-dummy" > .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml config --quiet

      - name: 프론트엔드 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: 백엔드 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
