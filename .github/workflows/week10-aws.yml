name: "Week10 AWS Lambda 배포 + 헬스체크"

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 항상 실행: Lambda 핸들러 로컬 단위 테스트
  local-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lambda 핸들러 로컬 테스트
        run: |
          python - << 'PYEOF'
          import json
          import sys
          sys.path.insert(0, '.')
          from lambda_handler import handler

          # 헬스체크 테스트
          event = {"rawPath": "/health"}
          response = handler(event, {})
          assert response["statusCode"] == 200
          body = json.loads(response["body"])
          assert body["status"] == "healthy"
          print("✅ /health 테스트 통과")

          # 루트 경로 테스트
          event2 = {"rawPath": "/"}
          response2 = handler(event2, {})
          assert response2["statusCode"] == 200
          print("✅ / 테스트 통과")

          print("✅ Lambda 핸들러 로컬 검증 완료")
          PYEOF

      - name: 패키지 압축 확인
        run: |
          zip -r lambda.zip lambda_handler.py
          ls -lh lambda.zip
          echo "✅ 배포 패키지 생성 완료: $(du -h lambda.zip | cut -f1)"

  # AWS 시크릿이 있을 때만 실제 배포
  deploy-lambda:
    needs: local-test
    runs-on: ubuntu-latest
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Lambda 패키지 압축
        run: zip -r lambda.zip lambda_handler.py

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Lambda 함수 업데이트
        run: |
          aws lambda update-function-code \
            --function-name visa-navigator \
            --zip-file fileb://lambda.zip

      - name: 헬스체크
        run: |
          sleep 10
          RESULT=$(aws lambda invoke \
            --function-name visa-navigator \
            --payload '{"rawPath":"/health"}' \
            --cli-binary-format raw-in-base64-out \
            response.json && cat response.json)
          echo "응답: $RESULT"
          echo "$RESULT" | python3 -c "
          import sys, json
          body = json.loads(sys.stdin.read())
          inner = json.loads(body.get('body', '{}'))
          assert inner.get('status') == 'healthy'
          print('✅ 헬스체크 통과')
          "
