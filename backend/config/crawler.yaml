#
# 환경변수 오버라이드: VEC_WEIGHT, KW_WEIGHT,
# CRAWL_MAX_DEPTH, CRAWL_MAX_PAGES, CRAWL_FETCH_TIMEOUT, CRAWL_SLEEP_SEC

allowed_sites:
- https://www.donga.ac.kr
- https://global.donga.ac.kr/global
- https://www.hikorea.go.kr
- https://www.immigration.go.kr
- https://www.hometax.go.kr
